<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ButterNet Rooms</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/themes.css">
</head>
<body>
<header class="nav">
<a class="logo" href="../index.html">🧈 ButterNet</a>
<nav>
<a href="../index.html">Home</a>
<a href="rooms.html">Rooms</a>
<a href="news.html">News</a>
<a href="downloads.html">Downloads</a>
</nav>
<div class="navButtons"><a class="button secondary" href="login.html">Log in</a></div>
</header>

<main class="section">
<span class="eyebrow">EXPLORE</span>
<h1>Rooms</h1>
<p class="hero p">Discover rooms published to ButterNet.</p>
<div id="rooms" class="cards">
<article class="featureCard"><div class="icon">⏳</div><h3>Loading rooms...</h3><p>Connecting to ButterNet.</p></article>
</div>
</main>

<script src="../js/api.js"></script>
<script>
async function loadRooms(){
 const box=document.getElementById("rooms");
 try{
   const data=await ButterNet.rooms();
   const rooms=Array.isArray(data)?data:(data.rooms||[]);
   if(!rooms.length){
     box.innerHTML='<article class="featureCard"><div class="icon">🧈</div><h3>No published rooms yet</h3><p>Rooms will appear here when the ButterNet backend is connected.</p></article>';
     return;
   }
   box.innerHTML=rooms.map(r=>`
   <article class="featureCard">
   <div class="icon">🎮</div>
   <h3>${r.name||"Unnamed Room"}</h3>
   <p>${r.description||"A ButterNet room."}</p>
   </article>`).join("");
 }catch(e){
   box.innerHTML='<article class="featureCard"><div class="icon">⚠️</div><h3>Failed to connect</h3><p>ButterNet could not retrieve the room list.</p></article>';
 }
}
loadRooms();
</script>
</body>
</html>
