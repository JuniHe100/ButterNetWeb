<!DOCTYPE html>

</head>
<body>
<main class="section" style="max-width:650px;margin:auto">

<span class="eyebrow">BUTTERNET ACCOUNT</span>

<input placeholder="Password" type="password" style="width:100%;padding:15px;margin:7px 0;border-radius:12px;border:1px solid #ddd">
<button class="button large" style="width:100%;margin-top:10px">Log in</button>
