<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - ButterNet</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/themes.css">
</head>
<body>
<main class="section" style="max-width:850px;margin:auto">
<a class="logo" href="../index.html">🧈 ButterNet</a>
<h1>Settings</h1>
<div class="featureCard">
<h3>Theme</h3>
<p>Choose how ButterNet looks.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button class="button" onclick="setTheme('light')">Light</button>
<button class="button secondary" onclick="setTheme('dark')">Dark</button>
<button class="button secondary" onclick="setTheme('system')">System</button>
</div>
</div>
</main>
<script>
function setTheme(t){
 if(t==="dark")document.body.classList.add("dark");
 else if(t==="light")document.body.classList.remove("dark");
 else{
  document.body.classList.toggle("dark",matchMedia("(prefers-color-scheme:dark)").matches);
 }
 localStorage.setItem("butternet-theme",t);
}
setTheme(localStorage.getItem("butternet-theme")||"system");
</script>
</body>
</html>
